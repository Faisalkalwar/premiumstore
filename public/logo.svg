<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00e65c" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background transparent -->
  <g transform="translate(10, 10)">
    <!-- PREMIUM - Graffiti Neon Green -->
    <text x="0" y="52" 
          font-family="'Impact', 'Syne', 'Arial Black', sans-serif" 
          font-size="46" 
          font-weight="900" 
          font-style="italic" 
          fill="#00e65c" 
          letter-spacing="2"
          filter="url(#glow)"
          transform="rotate(-2 100 40)">PREMIUM</text>
    
    <!-- STORE - Clean Bold White Badge / Text -->
    <text x="215" y="52" 
          font-family="'Syne', 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="36" 
          font-weight="900" 
          fill="#FFFFFF" 
          letter-spacing="1">STORE</text>
    
    <!-- Underline spray accent -->
    <path d="M 5 62 Q 120 68, 205 60 T 340 64" stroke="#00e65c" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
